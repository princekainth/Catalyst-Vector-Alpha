version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cva
      POSTGRES_PASSWORD: cva
      POSTGRES_DB: cva
    ports:
      - "5432:5432"
    volumes:
      - cva_pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  cva_pgdata:
